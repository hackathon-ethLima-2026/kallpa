[package]
name = "mock_usdc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["arbitrum", "ethereum", "stylus", "alloy"]
description = "MockUSDC — ERC-20 de 6 decimales con mint abierto, el dinero de la demo"

# Ver build.rs: existe solo para que Cargo resuelva [build-dependencies], que es lo
# que hace compilable stylus-proc en Windows.
build = "build.rs"

[dependencies]
alloy-primitives = "=0.8.20"
alloy-sol-types = "=0.8.20"
stylus-sdk = "0.9.0"
hex = { version = "0.4", default-features = false }
openzeppelin-stylus = "0.3.0"

# Fuerza "tiny-keccak" en el grafo del host, que desactiva el "native-keccak" que
# stylus-proc pide y que link.exe no puede resolver. Sin esto, `cargo test` no compila
# en Windows/MSVC. Ver build.rs y docs/build-spec.md §3.
[build-dependencies]
alloy-primitives = { version = "=0.8.20", features = ["tiny-keccak"] }

[dev-dependencies]
alloy-primitives = { version = "=0.8.20", features = ["sha3-keccak"] }
tokio = { version = "1.12.0", features = ["full"] }
ethers = "2.0"
eyre = "0.6.8"
stylus-sdk = { version = "0.9.0", features = ["stylus-test"] }

[features]
default = ["mini-alloc"]
export-abi = ["openzeppelin-stylus/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]

[[bin]]
name = "mock_usdc"
path = "src/main.rs"

[lib]
crate-type = ["lib", "cdylib"]
